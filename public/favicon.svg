<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a45"/><stop offset="0.6" stop-color="#c01e6c"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- ears -->
  <ellipse cx="18" cy="24" rx="9" ry="12" fill="#3a2f2a" transform="rotate(-18 18 24)"/>
  <ellipse cx="46" cy="24" rx="9" ry="12" fill="#3a2f2a" transform="rotate(18 46 24)"/>
  <!-- head -->
  <circle cx="32" cy="34" r="17" fill="#e7b277"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="42" rx="9" ry="7" fill="#3a2f2a"/>
  <circle cx="32" cy="39.5" r="2.4" fill="#1a1410"/>
  <!-- neon sunglasses -->
  <g>
    <rect x="17" y="29" width="12" height="8" rx="2.5" fill="#0b0b16" stroke="#00e5ff" stroke-width="1.6"/>
    <rect x="35" y="29" width="12" height="8" rx="2.5" fill="#0b0b16" stroke="#ff2e88" stroke-width="1.6"/>
    <path d="M29 32 H35" stroke="#fff" stroke-width="1.6"/>
  </g>
</svg>

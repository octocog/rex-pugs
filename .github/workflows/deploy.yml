name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'   # ~hourly: pull the latest pug count and redeploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch live pug count from Google Sheet
        env:
          SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOmwp2Q-D6kNK463qYPpRdb05kyvxkTD1jOwNrIxbHRe_a4OgXJl70UYf5KJ645OxrcjBUWlaiXKk/pub?gid=0&single=true&output=csv'
        run: node scripts/fetch-count.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
